x-nexus-environment: &nexus-environment
  NEXUS_ENVIRONMENT: production
  NEXUS_DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/nexus
  NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:?Set NEXUS_JWT_SECRET}
  NEXUS_JWT_ISSUER: ${NEXUS_JWT_ISSUER:-nexus}
  NEXUS_JWT_AUDIENCE: ${NEXUS_JWT_AUDIENCE:-nexus-api}
  NEXUS_SECRET_ENCRYPTION_KEY: ${NEXUS_SECRET_ENCRYPTION_KEY:?Set NEXUS_SECRET_ENCRYPTION_KEY}
  NEXUS_AI_BASE_URL: ${NEXUS_AI_BASE_URL:-https://api.openai.com/v1}
  NEXUS_AI_API_KEY: ${NEXUS_AI_API_KEY:-}
  NEXUS_INTEGRATION_ALLOWED_HOSTS: ${NEXUS_INTEGRATION_ALLOWED_HOSTS:-}

services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: *nexus-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    environment: *nexus-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *nexus-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_monitoring"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - nexus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexus-postgres:
