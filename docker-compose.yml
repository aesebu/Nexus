services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      NEXUS_DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus
      NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:-change-this-in-production}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    volumes:
      - nexus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexus-postgres:
